name: Build Dolibarr Module

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (leave empty to use module version)'
        required: false
        type: string
      create_release:
        description: 'Create a GitHub release'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get module version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            # Extract version from module descriptor
            VERSION=$(grep -oP "\\\$this->version\s*=\s*'\K[^']+" core/modules/modFournReadInvoice.class.php)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Module version: $VERSION"

      - name: Create module package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MODULE_NAME="fournreadinvoice"
          PACKAGE_NAME="module_${MODULE_NAME}-${VERSION}"

          # Create temporary directory with module structure
          mkdir -p "build_tmp/${MODULE_NAME}"

          # Copy files excluding unnecessary ones
          rsync -av --progress . "build_tmp/${MODULE_NAME}/" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='test' \
            --exclude='build_tmp' \
            --exclude='*.zip' \
            --exclude='.tx' \
            --exclude='modulebuilder.txt' \
            --exclude='.editorconfig' \
            --exclude='.gitattributes' \
            --exclude='*.back' \
            --exclude='.phpunit.result.cache'

          # Create ZIP file
          cd build_tmp
          zip -r "../${PACKAGE_NAME}.zip" "${MODULE_NAME}"
          cd ..

          # Cleanup
          rm -rf build_tmp

          echo "Created package: ${PACKAGE_NAME}.zip"
          ls -la "${PACKAGE_NAME}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: module_fournreadinvoice-${{ steps.version.outputs.version }}
          path: module_fournreadinvoice-${{ steps.version.outputs.version }}.zip
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: module_fournreadinvoice-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bump-version:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if version update needed
        id: check
        run: |
          NEW_VERSION="${{ github.event.inputs.version }}"
          CURRENT_VERSION=$(grep -oP "\\\$this->version\s*=\s*'\K[^']+" core/modules/modFournReadInvoice.class.php)

          if [ "$NEW_VERSION" = "$CURRENT_VERSION" ]; then
            echo "Version is already up to date ($CURRENT_VERSION)"
            echo "needs_update=false" >> $GITHUB_OUTPUT
          else
            echo "Version update needed: $CURRENT_VERSION -> $NEW_VERSION"
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Update version in module descriptor
        if: steps.check.outputs.needs_update == 'true'
        run: |
          NEW_VERSION="${{ github.event.inputs.version }}"
          sed -i "s/\$this->version = '[^']*'/\$this->version = '$NEW_VERSION'/" core/modules/modFournReadInvoice.class.php

          # Verify the change
          grep "version" core/modules/modFournReadInvoice.class.php | head -1

      - name: Create Pull Request
        if: steps.check.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump version to ${{ github.event.inputs.version }}"
          title: "chore: bump version to ${{ github.event.inputs.version }}"
          body: |
            This PR bumps the module version from ${{ steps.check.outputs.current_version }} to ${{ steps.check.outputs.new_version }}.

            Triggered by workflow dispatch.
          branch: version-bump-${{ github.event.inputs.version }}
          base: main
          delete-branch: true
